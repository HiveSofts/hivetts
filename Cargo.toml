[package]
name = "tts"
version = "0.1.0"
edition = "2021"

[dependencies]
slint = "1.17.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
whatlang = "0.6"
pdf-extract = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

[build-dependencies]
slint-build = "1.17.1"
